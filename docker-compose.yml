# One-command local stack: PostgreSQL + the ping backend (+ optional Prometheus).
# Values come from the .env file in this directory (copy .env.example -> .env first).
#
#   cp .env.example .env        # then paste your real MAIL_PASSWORD etc. into .env
#   docker compose up --build   # build + run db + app
#   docker compose --profile observability up --build   # also run Prometheus
#
# App:        http://localhost:8080
# Health:     http://localhost:8080/actuator/health
# Metrics:    http://localhost:8080/actuator/prometheus
# Prometheus: http://localhost:9090   (only with the observability profile)

services:
  postgres:
    image: postgres:16-alpine
    container_name: ping-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # host:container — host side is 5433 to avoid clashing with a local Postgres on 5432.
      # The app connects over the compose network (postgres:5432), so this is only for your
      # own external access (e.g. a DB GUI at localhost:5433). Remove this block if not needed.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ping-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres accepts connections
    environment:
      # --- Datasource (points at the postgres service on the compose network, not localhost) ---
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # --- Mail: your REAL Gmail creds come from .env (see MAIL_PASSWORD there) ---
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # --- Auth ---
      JWT_SECRET: ${JWT_SECRET}
      # --- Optional: allow monitoring private/localhost targets for local testing ---
      # MONITOR_SSRF_ALLOWPRIVATE: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Optional — only starts with:  docker compose --profile observability up
  prometheus:
    image: prom/prometheus:latest
    container_name: ping-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  postgres-data:
