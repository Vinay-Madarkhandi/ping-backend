services:
  postgres:
    image: postgres:16-alpine
    container_name: ping-postgres
    environment:
      POSTGRES_DB: ping
      POSTGRES_USER: root
      POSTGRES_PASSWORD: vinay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
