# Auto-loads dashboard JSON files from /var/lib/grafana/dashboards on startup.
apiVersion: 1

providers:
  - name: ping
    orgId: 1
    folder: Ping
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
