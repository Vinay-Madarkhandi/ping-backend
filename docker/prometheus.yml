# Scrapes the ping backend's actuator metrics and evaluates alert rules.
# Used by the "observability" compose profile (docker compose --profile observability up).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules are evaluated every evaluation_interval and pushed to Alertmanager.
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ping
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]   # the app service on the compose network

  # Prometheus scraping itself — lets you alert if Prometheus loses its own targets.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
