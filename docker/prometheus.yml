# Scrapes the ping backend's actuator metrics. Used only by the optional
# "observability" compose profile (docker compose --profile observability up).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: ping
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]   # the app service on the compose network
