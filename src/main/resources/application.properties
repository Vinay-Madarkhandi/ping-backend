spring.application.name=ping

# --- Datasource ---
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
# Persist all instants in UTC so due-time comparisons are timezone-independent across instances.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Task scheduling ---
# Dedicated pool so the poller, email outbox worker and retention job never starve each other.
spring.task.scheduling.pool.size=4
spring.task.scheduling.thread-name-prefix=monitor-sched-

# --- Mail ---
# NOTE: the previously hard-coded Gmail app password was committed to git and should be ROTATED.
# Provide credentials via MAIL_USERNAME / MAIL_PASSWORD env vars in real environments.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Auth ---
jwt.expiry=36000
cookie.expiry=36000
jwt.secret=${JWT_SECRET:}
# Secure-by-default: the browser will not store or send the cookie over plain HTTP. Local full-stack
# development against this app over http://localhost needs COOKIE_SECURE=false in .env; the README's
# curl-based examples are unaffected either way (curl does not enforce the Secure attribute).
cookie.secure=${COOKIE_SECURE:true}
# Lax (not None) since the frontend never needs the cookie on a cross-site request; Strict would also
# block the browser from sending it right after following a link from an external site (e.g. an email
# verification link), so Lax is the tightest policy that doesn't break that flow.
cookie.same-site=${COOKIE_SAME_SITE:Lax}
# Frontend URL for email verification and password reset links
frontend.url=${FRONTEND_URL:http://localhost:3000}

# --- Actuator / Observability ---
# Exposed endpoints. Only health/info/prometheus are made public in SpringSecurity (for scraping);
# the rest (metrics, loggers, threaddump) require auth — loggers lets you change log levels at runtime.
management.endpoints.web.exposure.include=health,info,prometheus,metrics,loggers,threaddump
management.endpoint.health.show-details=when_authorized
# Kubernetes-style liveness/readiness groups under /actuator/health/{liveness,readiness}.
management.endpoint.health.probes.enabled=true
# Do NOT let mail/SMTP reachability gate the health endpoint: the JavaMail indicator opens a blocking
# SMTP connection on every /actuator/health call and can hang for minutes when SMTP is slow/unreachable,
# which would flip liveness/readiness DOWN and get the instance killed. Email delivery is observed
# instead via the email-outbox metrics and the EmailDeadLettering Prometheus alert.
management.health.mail.enabled=false
# Surface build/git info (and the app name) on /actuator/info.
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Histogram buckets so Prometheus/Grafana can compute true p95/p99 (not just client-side percentiles).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.monitor.check.latency=true
# SLO buckets for request latency (ms-scale durations rendered in seconds by Prometheus).
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s,5s

# --- API documentation (springdoc / OpenAPI) ---
# Paths are pinned explicitly so the frontend's generated client and any CI contract check have a
# stable URL. Operations/tags are sorted so the emitted spec diffs cleanly between builds instead of
# reordering randomly on every startup. These endpoints are permitAll (see SpringSecurity) and must be
# network-restricted in production, exactly like the actuator endpoints above.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.writer-with-order-by-keys=true

# --- Monitoring engine ---
monitor.scheduler.poll-rate-ms=5000
monitor.scheduler.batch-size=100
monitor.scheduler.lease-margin=5s
# Monitors with an effective timeout >= this run in the slow bulkhead pool.
monitor.scheduler.slow-threshold-ms=5000

# Bulkhead pools: fast (low-timeout, latency-sensitive majority) vs slow (high-timeout) checks.
monitor.executor.fast.core-pool-size=8
monitor.executor.fast.max-pool-size=16
monitor.executor.fast.queue-capacity=200
monitor.executor.slow.core-pool-size=4
monitor.executor.slow.max-pool-size=8
monitor.executor.slow.queue-capacity=100

monitor.http.max-total=200
monitor.http.max-per-route=20
monitor.http.connect-timeout=5s
monitor.http.response-timeout=10s

monitor.alert.failure-threshold=3
monitor.alert.recovery-threshold=1
monitor.alert.cooldown=15m

monitor.email.max-attempts=5
monitor.email.backoff=1m
monitor.email.worker-rate-ms=30000
monitor.email.batch-size=50

monitor.retention.days=30
monitor.retention.cron=0 30 3 * * *

# Purges expired password-reset tokens, email-verification tokens, and revoked-JWT records.
monitor.token-cleanup.cron=0 0 4 * * *

# How often the cluster-singleton quota job reconciles per-user monthly usage with monitor blocking.
monitor.quota.enforce-rate-ms=300000

# Comma-separated emails allowed to access the admin usage endpoint (no role system exists).
monitor.admin.emails=

monitor.ssrf.enabled=true
monitor.ssrf.allow-private=false

# --- Billing (Razorpay) ---
# Test vs live differ ONLY by these values; no code change to go live. Use rzp_test_* in sandbox.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# How often the cluster-singleton job downgrades expired PRO subscriptions back to FREE.
monitor.billing.expiry-cron=0 15 * * * *
