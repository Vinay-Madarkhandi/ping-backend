spring.application.name=ping

# --- Datasource ---
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
# Persist all instants in UTC so due-time comparisons are timezone-independent across instances.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Task scheduling ---
# Dedicated pool so the poller, email outbox worker and retention job never starve each other.
spring.task.scheduling.pool.size=4
spring.task.scheduling.thread-name-prefix=monitor-sched-

# --- Mail ---
# NOTE: the previously hard-coded Gmail app password was committed to git and should be ROTATED.
# Provide credentials via MAIL_USERNAME / MAIL_PASSWORD env vars in real environments.
spring.mail.host=smtp.google.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Auth ---
jwt.expiry=36000
cookie.expiry=36000
jwt.secret=${JWT_SECRET:}

# --- Actuator / Observability ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized

# --- Monitoring engine ---
monitor.scheduler.poll-rate-ms=5000
monitor.scheduler.batch-size=100
monitor.scheduler.lease-margin=5s
# Monitors with an effective timeout >= this run in the slow bulkhead pool.
monitor.scheduler.slow-threshold-ms=5000

# Bulkhead pools: fast (low-timeout, latency-sensitive majority) vs slow (high-timeout) checks.
monitor.executor.fast.core-pool-size=8
monitor.executor.fast.max-pool-size=16
monitor.executor.fast.queue-capacity=200
monitor.executor.slow.core-pool-size=4
monitor.executor.slow.max-pool-size=8
monitor.executor.slow.queue-capacity=100

monitor.http.max-total=200
monitor.http.max-per-route=20
monitor.http.connect-timeout=5s
monitor.http.response-timeout=10s

monitor.alert.failure-threshold=3
monitor.alert.recovery-threshold=1
monitor.alert.cooldown=15m

monitor.email.max-attempts=5
monitor.email.backoff=1m
monitor.email.worker-rate-ms=30000
monitor.email.batch-size=50

monitor.retention.days=30
monitor.retention.cron=0 30 3 * * *

monitor.ssrf.enabled=true
monitor.ssrf.allow-private=false
