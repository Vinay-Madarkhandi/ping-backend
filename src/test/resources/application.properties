spring.datasource.url=jdbc:h2:mem:ping_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

jwt.expiry=36000
cookie.expiry=36000
jwt.secret=test-secret-value-that-is-at-least-32-bytes

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Disable the polling scheduler in tests (Postgres-only SKIP LOCKED query is exercised via Testcontainers in Phase 3).
monitor.scheduler.enabled=false
# Allow loopback/private hosts so tests can probe local stub servers.
monitor.ssrf.allow-private=true